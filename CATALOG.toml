# Machine-readable entry for this repository. Aggregated into public-software/catalog.
# Edit here; `pub catalog sync` propagates description, topics and custom properties to GitHub.

[repo]
name        = "platform"
ring        = "platform"          # spine | platform | system | domain | standards
layers      = ["L4"]
wave        = 1
tier        = "incubating"        # incubating | stable | core | archived
maintainers = ["maint-platform"]
summary     = "Foundational crates every repo uses: errors, config layering, tracing facade, paths, i18n (fluent), settings schema, diagnostics bundle."

